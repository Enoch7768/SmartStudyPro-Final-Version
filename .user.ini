; SmartStudyPro CMS large-upload configuration
; PHP supports unlimited POST size with post_max_size=0.
; upload_max_filesize=0 removes PHP's per-file upload ceiling.
; The operating system, web server, available storage, browser and hosting provider
; can still impose practical limits.
post_max_size=0
upload_max_filesize=0
max_input_time=0
max_execution_time=0
