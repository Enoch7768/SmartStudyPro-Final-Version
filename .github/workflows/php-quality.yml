name: PHP Quality

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint application PHP
        shell: bash
        run: |
          set -e
          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" || failed=1
          done < <(find . -type f -name '*.php' -not -path './cms/*' -not -path './assets/*' -not -path './vendor/*' -print0)
          exit "$failed"
